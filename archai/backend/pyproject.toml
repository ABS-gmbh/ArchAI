[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "manuscript-layout-api"
version = "1.0.0"
description = "FastAPI backend for medieval manuscript layout analysis"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.18",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.0.0",
    "ultralytics>=8.0.0",
    # <2.1, not <2.0: the models extra below needs NumPy 2.0 (kraken 6).
    "numpy<2.1",
    "pillow>=10.0.0",
    "matplotlib>=3.6.0",
    "shapely>=2.0.0",
    "rtree>=1.0.0",
    "langdetect>=1.0.9",
    "openai>=1.51.0",
    # Imported unguarded at module scope; without these `pip install -e .`
    # followed by `uvicorn app.main:app` fails at import time.
    "chromadb>=0.5.0",          # app/services/rag_store.py
    "requests>=2.31.0",         # app/services/glm_ollama_ocr.py
    "python-dotenv>=1.0.0",     # app/config.py (also required by pydantic-settings)
]

[project.optional-dependencies]
# OpenCV for an install without ultralytics, which brings its own build
# (opencv-python). Used by CI (scripts/ci_requirements.py); do not combine
# with a full install, as both builds provide the same cv2 module.
headless = [
    "opencv-python-headless>=4.8,<5",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]
# The inference stack pinned to the set the benchmarks were measured with and
# the evaluation VM runs (scripts/eval_vm/setup.sh): layout segmentation
# (ultralytics) and line recognition (kraken). An extra cannot name a package
# index, so on Linux pass PyTorch's CPU index, or pip fetches the CUDA build:
#   pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[models]"
models = [
    "torch==2.9.0",
    "torchvision==0.24.0",
    "kraken==6.0.3",
    "ultralytics==8.4.13",
    "numpy==2.0.2",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "requires_models: test needs real YOLO/Kraken weights or the inference stack (deselected in CI)",
]

# Non-strict type checking of the application (audit HYG-15). Run from this
# directory with `mypy`; it is not a CI check. The baseline it reports is in
# README.md ("Type checking"). Untyped function bodies are not checked
# (check_untyped_defs is off), so the count covers annotated code only.
[tool.mypy]
python_version = "3.10"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
